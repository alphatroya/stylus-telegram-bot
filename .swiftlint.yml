# SwiftLint Configuration
# https://github.com/realm/SwiftLint

# Paths to exclude from linting
excluded:
  - .build
  - .swiftpm
  - Package.swift

# Rules to enable
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - sorted_first_last
  - contains_over_first_not_nil
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional

# Rules to disable
disabled_rules:
  - trailing_comma

# Customizable rule configurations
line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 50
  excluded:
    - id
    - url
    - i
    - j
    - x
    - y

