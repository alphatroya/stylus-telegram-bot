name: Swift

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  swiftformat-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up mise
      uses: jdx/mise-action@v2
      with:
          install: true
          cache: true
          experimental: true

    - name: Check formatting with swiftformat
      run: swiftformat --lint --strict .

  swiftlint-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: GitHub Action for SwiftLint (Only files changed in the PR)
      uses: norio-nomura/action-swiftlint@3.2.1
      env:
        DIFF_BASE: ${{ github.event_name == 'pull_request' && github.base_ref || 'HEAD~1' }}

  test:
    runs-on: macos-latest
    needs: [swiftformat-check, swiftlint-check]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build
      run: swift build

    # Run tests without coverage for fast feedback
    # Coverage analysis runs separately in the coverage job below
    - name: Run tests
      run: swift test

  coverage:
    runs-on: macos-latest
    needs: [swiftformat-check, swiftlint-check]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build
      run: swift build

    - name: Run tests with coverage
      run: swift test --enable-code-coverage

    - name: Generate coverage report (LCOV format)
      run: |
        # Find the test binary (usually named <PackageName>PackageTests.xctest)
        TEST_BINARY=$(find .build/debug -name "*.xctest" -type d | head -n 1)
        if [ -z "$TEST_BINARY" ]; then
          echo "Error: Could not find test binary"
          exit 1
        fi
        xcrun llvm-cov export -format="lcov" \
          "$TEST_BINARY/Contents/MacOS/$(basename $TEST_BINARY .xctest)" \
          -instr-profile .build/debug/codecov/default.profdata > coverage.lcov

    # Upload to Codecov for coverage tracking and visualization
    # fail_ci_if_error is false to prevent blocking if Codecov is temporarily unavailable
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.lcov
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
